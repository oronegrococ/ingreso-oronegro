<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oro Negro - Registro de Ingreso</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
  
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --accent: #00e676;
      --text: #ffffff;
      --text-dim: #b0bec5;
      --border: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    h2 {
      color: var(--accent);
      margin-top: 0;
      text-align: center;
      font-size: 20px;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    .iti { width: 100%; }
    .iti__country-list { background-color: #2a2a2a; color: #ffffff; }

    .btn-submit {
      background: var(--accent);
      color: #000000;
      font-weight: bold;
      border: none;
      padding: 14px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
    
    /* CAMPO HONEYPOT (INVENTADO PARA CAZAR BOTS) */
    .hp-field {
      opacity: 0;
      position: absolute;
      top: 0;
      left: 0;
      height: 0;
      width: 0;
      z-index: -1;
    }
    
    #msgStatus {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
      min-height: 20px;
    }

    /* TARJETA DE CONFIRMACIÓN / COMPROBANTE DIGITAL */
    .ticket-card {
      background: #142a1e;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-top: 10px;
    }

    .ticket-card h3 {
      color: var(--accent);
      font-size: 18px;
      margin-bottom: 10px;
    }

    .ticket-info {
      text-align: left;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin: 15px 0;
      border: 1px solid #333;
    }

    .ticket-info div {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .ticket-info label {
      color: var(--text-dim);
      margin: 0;
    }

    .ticket-info span {
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="form-card">
  <h2>REGISTRO DE LLEGADA • EGGER</h2>
  
  <form id="ingresoForm" onsubmit="prepararEnvio(event)">
    
    <!-- Token de Sesión Inyectado por Apps Script (Reemplaza la API Key fija) -->
    <input type="hidden" id="formToken" value="<?= formToken ?>">

    <!-- HONEYPOT ANTI-BOT (Invisible para humanos) -->
    <div class="hp-field">
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="empresa">Empresa / Transportista *</label>
      <input type="text" id="empresa" name="empresa" required placeholder="Ej: Transportes RIPARI" maxlength="100">
    </div>

    <div class="form-group">
      <label for="chofer">Nombre y Apellido del Chofer *</label>
      <input type="text" id="chofer" name="chofer" required placeholder="Ej: Cristian Gómez" maxlength="100">
    </div>

    <div class="form-group">
      <label for="patente">Patente (Chasis / Acoplado) *</label>
      <input type="text" id="patente" name="patente" required placeholder="Ej: AA123CD / AB456EF" style="text-transform:uppercase;" maxlength="30">
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono Celular / WhatsApp *</label>
      <input type="tel" id="telefono" required>
    </div>

    <div class="form-group">
      <label for="sec1">Operación Principal *</label>
      <select id="sec1" name="sec1" required onchange="cambiarNivelOperacion()">
        <option value="">-- Seleccionar Operación --</option>
        <option value="CARGA">🚚 CARGA</option>
        <option value="DESCARGA">📦 DESCARGA</option>
      </select>
    </div>

    <div class="form-group hidden" id="grupoCarga">
      <label for="sec2">Tipo de Carga *</label>
      <select id="sec2" name="sec2">
        <option value="">-- Seleccionar Tipo de Carga --</option>
        <option value="NACIONAL">Carga - Nacional</option>
        <option value="MERCOSUR">Carga - Mercosur</option>
        <option value="CONTENEDORES">Carga - Contenedores</option>
        <option value="OTROS">Carga - Otros</option>
      </select>
    </div>

    <div class="form-group hidden" id="grupoDescarga">
      <label for="sec3">Tipo de Descarga *</label>
      <select id="sec3" name="sec3">
        <option value="">-- Seleccionar Tipo de Descarga --</option>
        <option value="RESINAS">Descarga - Resinas</option>
        <option value="MADERAS">Descarga - Maderas</option>
        <option value="PRODUCTO TERMINADO">Descarga - Producto Terminado</option>
        <option value="OTROS">Descarga - Otros</option>
      </select>
    </div>

    <div class="form-group">
      <label for="detalle">Observaciones / Remito / Orden</label>
      <textarea id="detalle" name="detalle" rows="2" placeholder="Detalles adicionales..." maxlength="250"></textarea>
    </div>

    <button type="submit" id="btnGuardar" class="btn-submit">REGISTRAR LLEGADA</button>
  </form>

  <div id="msgStatus"></div>

  <!-- COMPROBANTE DIGITAL MOSTRADO AL COMPLETAR -->
  <div id="ticketExito" class="ticket-card hidden">
    <h3>¡REGISTRO COMPLETADO!</h3>
    <p style="font-size:13px; color:#c8e6c9;">Su lugar en la fila ha sido reservado.</p>
    
    <div class="ticket-info">
      <div><label>Hora Registro:</label> <span id="tkHora">-</span></div>
      <div><label>Empresa:</label> <span id="tkEmpresa">-</span></div>
      <div><label>Chofer:</label> <span id="tkChofer">-</span></div>
      <div><label>Patente:</label> <span id="tkPatente">-</span></div>
      <div><label>Operación:</label> <span id="tkOperacion">-</span></div>
    </div>

    <p style="font-size:13px; font-weight:bold; color:var(--accent);">POR FAVOR ESTACIONE EN PLAYA Y AGUARDE SU LLAMADO POR WHATSAPP</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-P0vCEdzjqcg-n5yxcxETkc0CzyactHOivGwDG94hBj8dmnSwUX9J8shGYDxUSC0YAw/exec";

  const phoneInput = document.querySelector("#telefono");
  const iti = window.intlTelInput(phoneInput, {
    initialCountry: "ar",
    preferredCountries: ["ar", "br", "uy", "py", "cl"],
    separateDialCode: true,
    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
  });

  function cambiarNivelOperacion() {
    const sec1 = document.getElementById('sec1').value;
    const grupoCarga = document.getElementById('grupoCarga');
    const grupoDescarga = document.getElementById('grupoDescarga');
    const sec2 = document.getElementById('sec2');
    const sec3 = document.getElementById('sec3');

    if (sec1 === 'CARGA') {
      grupoCarga.classList.remove('hidden');
      grupoDescarga.classList.add('hidden');
      sec2.required = true;
      sec3.required = false;
      sec3.value = '';
    } else if (sec1 === 'DESCARGA') {
      grupoDescarga.classList.remove('hidden');
      grupoCarga.classList.add('hidden');
      sec3.required = true;
      sec2.required = false;
      sec2.value = '';
    } else {
      grupoCarga.classList.add('hidden');
      grupoDescarga.classList.add('hidden');
      sec2.required = false;
      sec3.required = false;
    }
  }

  async function prepararEnvio(e) {
    e.preventDefault();

    if (!iti.isValidNumber()) {
      alert("Por favor ingrese un número de teléfono celular válido.");
      return false;
    }

    const btn = document.getElementById('btnGuardar');
    const status = document.getElementById('msgStatus');
    
    btn.disabled = true;
    status.style.color = '#ffd54f';
    status.innerText = "Registrando ingreso, aguarde...";

    // Obtener IP pública rápida para control de tasa
    let userIp = '';
    try {
      const resIp = await fetch('https://api.ipify.org?format=json');
      const dataIp = await resIp.json();
      userIp = dataIp.ip || '';
    } catch(errIp) { userIp = ''; }

    const empresa = document.getElementById('empresa').value.trim();
    const chofer = document.getElementById('chofer').value.trim();
    const patente = document.getElementById('patente').value.trim().toUpperCase();
    const sec1 = document.getElementById('sec1').value;
    const sec2 = document.getElementById('sec2').value;
    const sec3 = document.getElementById('sec3').value;
    const opDetalle = (sec1 === 'CARGA') ? sec2 : sec3;

    const payload = new FormData();
    payload.append('formToken', document.getElementById('formToken').value);
    payload.append('website', document.getElementById('website').value); // Honeypot
    payload.append('userIp', userIp);
    payload.append('empresa', empresa);
    payload.append('chofer', chofer);
    payload.append('patente', patente);
    payload.append('telefono', iti.getNumber());
    payload.append('sec1', sec1);
    payload.append('sec2', sec2);
    payload.append('sec3', sec3);
    payload.append('detalle', document.getElementById('detalle').value.trim());

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: payload
    })
    .then(response => response.json())
    .then(data => {
      if (data && data.exito) {
        mostrarExito({
          empresa: empresa,
          chofer: chofer,
          patente: patente,
          operacion: sec1 + ' - ' + opDetalle,
          hora: data.horaIngreso || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        });
      } else {
        status.style.color = '#ff5252';
        status.innerText = data ? data.mensaje : "Error procesando el registro.";
        btn.disabled = false;
      }
    })
    .catch(err => {
      status.style.color = '#ff5252';
      status.innerText = "Error de conexión con el servidor. Intente nuevamente.";
      btn.disabled = false;
    });
  }

  function mostrarExito(datos) {
    document.getElementById('ingresoForm').classList.add('hidden');
    document.getElementById('msgStatus').classList.add('hidden');
    
    document.getElementById('tkHora').innerText = datos.hora + " hs";
    document.getElementById('tkEmpresa').innerText = datos.empresa;
    document.getElementById('tkChofer').innerText = datos.chofer;
    document.getElementById('tkPatente').innerText = datos.patente;
    document.getElementById('tkOperacion').innerText = datos.operacion;
    
    document.getElementById('ticketExito').classList.remove('hidden');
  }
</script>

</body>
</html>
