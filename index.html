<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oro Negro - Registro de Ingreso</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
  
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --accent: #00e676;
      --accent-hover: #00c853;
      --text: #ffffff;
      --text-dim: #b0bec5;
      --border: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    h2 {
      color: var(--accent);
      margin-top: 0;
      text-align: center;
      font-size: 20px;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    .iti { width: 100%; }
    .iti__country-list { background-color: #2a2a2a; color: #ffffff; }

    .btn-submit {
      background: var(--accent);
      color: #000000;
      font-weight: bold;
      border: none;
      padding: 14px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none; }
    
    #msgStatus {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>

<div class="form-card">
  <h2>REGISTRO DE INGRESO • ORO NEGRO</h2>
  
  <!-- Formulario nativo con target a un iframe oculto -->
  <iframe name="hiddenFrame" id="hiddenFrame" style="display:none;" onload="if(submitted) mostrarExito();"></iframe>
  
  <form id="ingresoForm" action="https://script.google.com/macros/s/AKfycbwaPzoNEZYryt_sYZj3YK2DpQ50Uwiz694BsOLjCJaFZT20nRhjbHVUzH_INqhwkE3UqA/exec" method="POST" target="hiddenFrame" onsubmit="prepararEnvio(event)">
    
    <input type="hidden" name="apiKey" value="OroNegro_Secure_Token_2026_x89!">
    <input type="hidden" id="telefonoHidden" name="telefono" value="">

    <div class="form-group">
      <label for="empresa">Empresa / Transportista *</label>
      <input type="text" id="empresa" name="empresa" required placeholder="Ej: Transportes RIPARI" maxlength="100">
    </div>

    <div class="form-group">
      <label for="chofer">Nombre y Apellido del Chofer *</label>
      <input type="text" id="chofer" name="chofer" required placeholder="Ej: Cristian Gómez" maxlength="100">
    </div>

    <div class="form-group">
      <label for="patente">Patente (Chasis / Acoplado) *</label>
      <input type="text" id="patente" name="patente" required placeholder="Ej: AA123CD / AB456EF" style="text-transform:uppercase;" maxlength="30">
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono Celular / WhatsApp *</label>
      <input type="tel" id="telefono" required>
    </div>

    <div class="form-group">
      <label for="sec1">Operación Principal *</label>
      <select id="sec1" name="sec1" required onchange="cambiarNivelOperacion()">
        <option value="">-- Seleccionar Operación --</option>
        <option value="CARGA">🚚 CARGA</option>
        <option value="DESCARGA">📦 DESCARGA</option>
      </select>
    </div>

    <div class="form-group hidden" id="grupoCarga">
      <label for="sec2">Tipo de Carga *</label>
      <select id="sec2" name="sec2">
        <option value="">-- Seleccionar Tipo de Carga --</option>
        <option value="NACIONAL">Carga - Nacional</option>
        <option value="MERCOSUR">Carga - Mercosur</option>
        <option value="CONTENEDORES">Carga - Contenedores</option>
        <option value="OTROS">Carga - Otros</option>
      </select>
    </div>

    <div class="form-group hidden" id="grupoDescarga">
      <label for="sec3">Tipo de Descarga *</label>
      <select id="sec3" name="sec3">
        <option value="">-- Seleccionar Tipo de Descarga --</option>
        <option value="RESINAS">Descarga - Resinas</option>
        <option value="MADERAS">Descarga - Maderas</option>
        <option value="PRODUCTO TERMINADO">Descarga - Producto Terminado</option>
        <option value="OTROS">Descarga - Otros</option>
      </select>
    </div>

    <div class="form-group">
      <label for="detalle">Observaciones / Remito / Orden</label>
      <textarea id="detalle" name="detalle" rows="2" placeholder="Detalles adicionales..." maxlength="250"></textarea>
    </div>

    <button type="submit" id="btnGuardar" class="btn-submit">REGISTRAR INGRESO</button>
  </form>

  <div id="msgStatus"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>

<script>
  let submitted = false;

  const phoneInput = document.querySelector("#telefono");
  const iti = window.intlTelInput(phoneInput, {
    initialCountry: "ar",
    preferredCountries: ["ar", "br", "uy", "py", "cl"],
    separateDialCode: true,
    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
  });

  function cambiarNivelOperacion() {
    const sec1 = document.getElementById('sec1').value;
    const grupoCarga = document.getElementById('grupoCarga');
    const grupoDescarga = document.getElementById('grupoDescarga');
    const sec2 = document.getElementById('sec2');
    const sec3 = document.getElementById('sec3');

    if (sec1 === 'CARGA') {
      grupoCarga.classList.remove('hidden');
      grupoDescarga.classList.add('hidden');
      sec2.required = true;
      sec3.required = false;
      sec3.value = '';
    } else if (sec1 === 'DESCARGA') {
      grupoDescarga.classList.remove('hidden');
      grupoCarga.classList.add('hidden');
      sec3.required = true;
      sec2.required = false;
      sec2.value = '';
    } else {
      grupoCarga.classList.add('hidden');
      grupoDescarga.classList.add('hidden');
      sec2.required = false;
      sec3.required = false;
    }
  }

  function prepararEnvio(e) {
    if (!iti.isValidNumber()) {
      e.preventDefault();
      alert("Por favor ingrese un número de teléfono celular válido.");
      return false;
    }

    document.getElementById('telefonoHidden').value = iti.getNumber();
    document.getElementById('patente').value = document.getElementById('patente').value.trim().toUpperCase();

    const btn = document.getElementById('btnGuardar');
    const status = document.getElementById('msgStatus');
    
    btn.disabled = true;
    status.style.color = '#ffd54f';
    status.innerText = "Registrando ingreso...";
    
    submitted = true;
    return true;
  }

  function mostrarExito() {
    const status = document.getElementById('msgStatus');
    const btn = document.getElementById('btnGuardar');
    
    status.style.color = '#00e676';
    status.innerText = "¡Registro completado con éxito!";
    document.getElementById('ingresoForm').reset();
    cambiarNivelOperacion();
    btn.disabled = false;
    submitted = false;
  }
</script>

</body>
</html>
